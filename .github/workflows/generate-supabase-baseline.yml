name: Generate Supabase Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate baseline migration
        run: npm run db:generate-baseline

      - name: Commit generated SQL to development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/20261118000000_init_postgresql/migration.sql
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate Supabase baseline migration"
            git push origin development
          fi
