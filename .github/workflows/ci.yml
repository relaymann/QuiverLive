name: QuiverLive CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]

concurrency:
  group: quiverlive-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://quiverlive:quiverlive@127.0.0.1:5432/quiverlive
      DIRECT_URL: postgresql://quiverlive:quiverlive@127.0.0.1:5432/quiverlive
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cXVpdmVybGl2ZS5jb20k
      CLERK_SECRET_KEY: sk_test_quiverlive_ci_placeholder
      NEXT_PUBLIC_LIVEKIT_WS_URL: wss://example.livekit.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Verify PostgreSQL baseline migration
        shell: bash
        run: |
          set -euo pipefail
          baseline="prisma/migrations/20261118000000_init_postgresql/migration.sql"

          if [[ -s "$baseline" ]]; then
            npx prisma migrate diff \
              --from-empty \
              --to-schema-datamodel prisma/schema.prisma \
              --script > /tmp/schoolstream-baseline.sql
            diff -u "$baseline" /tmp/schoolstream-baseline.sql
          else
            npm run db:generate-baseline
          fi
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Run production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Fail on critical vulnerabilities in any dependency
        run: npm audit --audit-level=critical
