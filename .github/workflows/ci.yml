name: SchoolStream CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]

concurrency:
  group: schoolstream-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://schoolstream:schoolstream@127.0.0.1:3306/schoolstream
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2Nob29sc3RyZWFtLmNvbSQ
      CLERK_SECRET_KEY: sk_test_schoolstream_ci_placeholder
      NEXT_PUBLIC_LIVEKIT_WS_URL: wss://example.livekit.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile metadata before clean install
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Run production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Fail on critical vulnerabilities in any dependency
        run: npm audit --audit-level=critical
