name: SchoolStream lockfile sync

on:
  push:
    branches: [development]
    paths:
      - package.json
      - .github/workflows/lockfile-sync.yml

permissions:
  contents: write

concurrency:
  group: schoolstream-lockfile-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate and security-patch lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-audit --no-fund || true
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh dependency lockfile and apply compatible security fixes"
          git fetch origin development
          git rebase origin/development
          git push origin development
